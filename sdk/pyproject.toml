[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insidious"
version = "0.1.0"
description = "Festive-season readiness SDK: flag-driven load shedding, SLO metrics, and DB scaling hooks for self-hosted apps"
# README via `dynamic` so a source install that does not copy README.md (e.g. a slim Dockerfile) still builds.
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Insidious contributors" }]
keywords = [
    "feature-flags",
    "flagsmith",
    "load-shedding",
    "graceful-degradation",
    "slo",
    "prometheus",
    "sqlalchemy",
    "fastapi",
    "observability",
    "sre",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "flagsmith>=5.0",
    "prometheus-client>=0.20",
    "pyyaml>=6.0",
    "starlette>=0.37",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
test = ["pytest>=8", "pytest-asyncio>=0.23", "fastapi>=0.110", "httpx>=0.27", "sqlalchemy>=2.0"]

[project.urls]
Homepage = "https://github.com/aloysjehwin/insidious"
Documentation = "https://github.com/aloysjehwin/insidious/tree/main/sdk#readme"
Repository = "https://github.com/aloysjehwin/insidious"
Issues = "https://github.com/aloysjehwin/insidious/issues"

[tool.setuptools]
packages = ["insidious"]

[tool.setuptools.package-data]
insidious = ["py.typed"]

[tool.setuptools.dynamic]
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
