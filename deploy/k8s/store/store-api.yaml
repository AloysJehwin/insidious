# Jeffy store (FastAPI + insidious SDK) + /ops cockpit.
# One replica with a 500m CPU limit on purpose: a single pod saturates under `make festive-rush`,
# so shedding heavy_features (Flagsmith) or scaling 1 -> 3 (NudgeBee k8s.horizontal_rightsize) visibly helps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-api
  namespace: store
  labels:
    app: store-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: store-api
  template:
    metadata:
      labels:
        app: store-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: store-api
          image: insidious/store-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: insidious-env
                optional: true
          # `env` wins over `envFrom`, so these in-cluster URLs override the compose-style ones in .env.
          env:
            - name: INSIDIOUS_CONFIG
              value: /config/insidious.yaml
            - name: INSIDIOUS_FLAGS
              value: /config/flags.yaml
            - name: STORE_URL
              value: http://store-api.store.svc.cluster.local:8000
            - name: PAYMENTS_URL
              value: http://payments-mock.store.svc.cluster.local:8001
            - name: GUARDIAN_URL
              value: http://guardian.insidious.svc.cluster.local:8002
            - name: OPS_BOT_URL
              value: http://ops-bot.insidious.svc.cluster.local:8003
            - name: PROMETHEUS_URL
              value: http://prometheus.insidious.svc.cluster.local:9090
            - name: HEAVY_WORK_MS
              value: "40"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Readiness only (no liveness): a CPU-saturated pod must stay in the Service and get slow,
          # not get restarted mid-demo. Generous thresholds so saturation shows as latency, not 503s.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: insidious-config
---
apiVersion: v1
kind: Service
metadata:
  name: store-api
  namespace: store
  labels:
    app: store-api
spec:
  selector:
    app: store-api
  ports:
    - name: http
      port: 8000
      targetPort: http
