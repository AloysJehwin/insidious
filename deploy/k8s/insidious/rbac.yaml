# guardian (ns insidious) may read Deployments in ns store, to report store-api availableReplicas.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: guardian-read-deployments
  namespace: store
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardian-read-deployments
  namespace: store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: guardian-read-deployments
subjects:
  - kind: ServiceAccount
    name: guardian
    namespace: insidious
