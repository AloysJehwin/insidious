[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "insidious-cli"
version = "0.1.0"
description = "Insidious CLI: init, rehearse, guard, status, reset, scan"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
insidious = "insidious_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["insidious_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
